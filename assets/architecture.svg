<svg width="100%" viewBox="0 0 680 660" role="img" style="" xmlns="http://www.w3.org/2000/svg">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<title style="fill:#111827;stroke:none;color:#111827;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">FaceGate-Linux system architecture</title>
<desc style="fill:#111827;stroke:none;color:#111827;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Structural diagram showing how a protected app launch flows through launcher substitution and process-poll interception into the FaceGate daemon, which spawns an isolated recognition subprocess, checks against a security and storage layer holding the crypto store, encrypted vault, and audit log, then resumes or kills the process.</desc>
