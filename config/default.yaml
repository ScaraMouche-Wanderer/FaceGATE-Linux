app_monitor:
  # poll_interval_seconds: Polling frequency for detecting protected apps.
  # Lowering this improves detection latency (0.2s = 200ms window) for process interception.
  poll_interval_seconds: 0.2
  on_auth_failure: kill
  auth_timeout_seconds: 60
protected_apps: []
auth: {}
authentication:
  password_fallback_grace_seconds: 15
recognition:
  similarity_threshold: 0.52
  ambiguity_margin: 0.03
  # liveness_min_motion: minimum cumulative bounding-box centroid movement (in
  # pixels, summed across the confirmation frames) required before a
  # high-confidence face match is allowed to authenticate. This is the primary
  # defense against a printed photo or a phone/tablet held up to the camera.
  # A value of 0.5 tolerates normal head/hand micro-jitter while still
  # rejecting a rigidly-held static image. To explicitly disable this check
  # (NOT recommended - see SECURITY.md), set this to -1. Do NOT set this to
  # 0 - auth_dialog.py treats 0/missing as "use the safe floor" specifically
  # so this can't be silently disabled by a blank/zeroed config value.
  liveness_min_motion: 0.5
security:
  session_timeout_seconds: 300
  pbkdf2_iterations: 600000
  salt_length_bytes: 16
  lock_settings_window: true
  persist_vault_key: false
  # deny_on_missing_state: If true (default), missing critical state files
  # (embeddings.enc, lockout.json, etc.) after initial setup are treated as
  # tamper attacks — the daemon locks down rather than failing open.
  # Set to false only if you want legacy "fail-open" behavior.
  deny_on_missing_state: true
behavior:
  launcher_recheck_interval_minutes: 10
  notify_on_auth: true
  autolock_on_idle: false
  autolock_on_idle_minutes: 10
  startup_delay_seconds: 0
  launch_at_login: true
  uninstall_protection: true
  lock_on_sleep_or_lock: true
  theme: light
  sound_effects: true
  sound_volume: 0.15
  # tray_icon_style: which preset glyph to use for the system tray icon.
  # One of: circle, square, shield, lock, gate. See src/ui/tray.py TRAY_ICON_STYLES.
  tray_icon_style: circle
camera:
  backend: V4L2
  fps: 30
  height: 480
  ir_color_variance_threshold: 15.0
  skip_frames: 2
  width: 640
database:
  path: ~/.config/facegate/facegate.db
locked_apps: null
ui:
  developer_mode: false
  fps_counter: true
  logging_enabled: true
  theme: light

