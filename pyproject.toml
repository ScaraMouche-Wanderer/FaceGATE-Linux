[tool.poetry]
name = "facegate"
version = "1.2.0"
description = "FaceGate-Linux: A lightweight locking skeleton tray daemon and monitor"

authors = ["ScaraMouche-Wanderer <prathmeshnarwaria@gmail.com>"]
readme = "README.md"
packages = [{include = "*", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
pyside6 = ">=6.0"
psutil = ">=5.9"
pyyaml = ">=6.0"
onnxruntime = "^1.27.0"
opencv-python-headless = ">=4.10.0,<5.0.0"
insightface = "^1.0.1"
cryptography = "^44.0.0"


[tool.poetry.scripts]
facegate = "core.monitor_main:main"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "ruff (>=0.9.0)",
    "mypy (>=1.14.0)"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
